# Кладётся в /etc/systemd/journald.conf (применить: systemctl restart systemd-journald)
#
# journald НЕ управляется logrotate — у него свои лимиты. Дефолт SystemMaxUse
# это 10% раздела (на типовом VPS-диске 20 GB — около 2 GB), поэтому journal
# тихо разрастается до сотен мегабайт и на маленьком VPS это заметно.
[Journal]
MaxRetentionSec=1month
SystemMaxUse=300M
SystemMaxFileSize=50M
